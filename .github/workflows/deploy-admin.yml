name: Deploy staff console

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      # The console builds from source, and some of that source is not under
      # admin/. tokens.css and the mark are shared with the application and
      # the marketing site, one copy each, so a change to either changes what
      # this job would publish. deploy-site.yml learned this the hard way:
      # without these lines the job never ran, because nothing under its own
      # directory had moved.
      - "ui/src/tokens.css"
      - "brand/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:
    inputs:
      bucket:
        description: Target S3 bucket
        required: false
        default: arqedia-dev-admin-667523685221
      distribution:
        description: Target CloudFront distribution id
        required: false
      role:
        description: Deploy role to assume
        required: false
        default: arn:aws:iam::667523685221:role/arqedia-dev-github-deploy-admin

permissions:
  id-token: write
  contents: read

# ITS OWN ROLE, not the one the application and the site share. That role can
# write their two buckets and invalidate their two distributions and cannot
# touch this one; this role is the reverse. See ci.tf.
env:
  AWS_REGION: us-east-2
  BUCKET: ${{ inputs.bucket || 'arqedia-dev-admin-667523685221' }}
  # NOT KNOWN UNTIL THE FIRST APPLY. A distribution id is generated by AWS,
  # so it cannot be written here in advance and is not guessed: the job stops
  # with a sentence saying what to do rather than invalidating nothing, or
  # something else. `terraform output -raw admin_distribution_id` prints it.
  DISTRIBUTION: ${{ inputs.distribution || 'SET_AFTER_FIRST_APPLY' }}
  DEPLOY_ROLE: ${{ inputs.role || 'arn:aws:iam::667523685221:role/arqedia-dev-github-deploy-admin' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the distribution is known
        run: |
          if [ "$DISTRIBUTION" = "SET_AFTER_FIRST_APPLY" ]; then
            echo "The staff console's CloudFront distribution id is not set."
            echo "Run: terraform output -raw admin_distribution_id"
            echo "Then put it in this workflow's DISTRIBUTION default, or"
            echo "supply it as the 'distribution' input on a manual run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build is the type check. tsc -b runs first, so a type error stops
      # this before anything is published.
      #
      # npm ci, not npm install: the lock file is committed and a deploy must
      # build what it says rather than whatever resolved today.
      - name: Build
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets are immutable; the HTML is not.
      - name: Upload assets
        run: |
          aws s3 sync admin/dist "s3://${BUCKET}/" --delete \
            --exclude "*.html" --cache-control "public,max-age=31536000,immutable"

      - name: Upload pages
        run: |
          aws s3 sync admin/dist "s3://${BUCKET}/" --delete \
            --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
